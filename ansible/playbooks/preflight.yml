---
- name: Read-only Proxmox node preflight
  hosts: proxmox_nodes
  gather_facts: false
  tasks:
    - name: Check SSH/Python connectivity
      ansible.builtin.ping:

    - name: Read Proxmox version
      ansible.builtin.command: pveversion -v
      register: pve_version
      changed_when: false
      failed_when: false

    - name: Read hostname
      ansible.builtin.command: hostname --static
      register: hostname_result
      changed_when: false
      failed_when: false

    - name: Read IPv4 addresses
      ansible.builtin.command: ip -4 -o addr show
      register: ip_addresses
      changed_when: false
      failed_when: false

    - name: Ping peer node
      ansible.builtin.command:
        argv: [ping, -c, "3", -W, "2", "{{ proxmox_peer_ip }}"]
      register: peer_ping
      changed_when: false
      failed_when: false

    - name: Check time synchronization
      ansible.builtin.command: timedatectl show -p NTPSynchronized --value
      register: ntp_sync
      changed_when: false
      failed_when: false

    - name: Check nested virtualization flags
      ansible.builtin.shell: "grep -m 1 -E -o 'vmx|svm' /proc/cpuinfo"
      args:
        executable: /bin/bash
      register: nested_virtualization
      changed_when: false
      failed_when: false

    - name: Read cluster status (may not yet be clustered)
      ansible.builtin.command: pvecm status
      register: cluster_status
      changed_when: false
      failed_when: false

    - name: Set node preflight status
      ansible.builtin.set_fact:
        pve_preflight_status: >-
          {{ 'PASS' if pve_version.rc == 0
          and hostname_result.stdout | trim == inventory_hostname
          and proxmox_node_ip in ip_addresses.stdout
          and peer_ping.rc == 0
          and ntp_sync.stdout | default('') | trim | lower == 'yes'
          and nested_virtualization.rc == 0 else 'FAIL' }}

    - name: Show test outcomes
      ansible.builtin.debug:
        msg:
          node: "{{ inventory_hostname }}"
          ip: "{{ proxmox_node_ip }}"
          overall: "{{ pve_preflight_status }}"
          pve_installed: "{{ pve_version.rc == 0 }}"
          hostname_matches_inventory: "{{ hostname_result.stdout | default('') | trim == inventory_hostname }}"
          requested_ip_present: "{{ proxmox_node_ip in (ip_addresses.stdout | default('')) }}"
          peer_ping: "{{ 'PASS' if peer_ping.rc == 0 else 'FAIL' }}"
          ntp_sync: "{{ ntp_sync.stdout | default('NOT RUN') | trim }}"
          nested_virtualization: "{{ 'PASS' if nested_virtualization.rc == 0 else 'FAIL' }}"

- name: Write preflight report on controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports"
        state: directory
        mode: "0750"

    - name: Write aggregated JSON report
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../reports/ansible-preflight.json"
        mode: "0640"
        content: |
          {
            "generated_at": {{ lookup('pipe', 'date -Is') | to_json }},
            "nodes": {
          {% for node in groups['proxmox_nodes'] %}
              "{{ node }}": {
                "ip": {{ hostvars[node].proxmox_node_ip | to_json }},
                "status": {{ hostvars[node].pve_preflight_status | default('NOT RUN') | to_json }},
                "pve_version_rc": {{ hostvars[node].pve_version.rc | default(99) }},
                "pve_version": {{ hostvars[node].pve_version.stdout | default('NOT RUN') | to_json }},
                "peer_ping_rc": {{ hostvars[node].peer_ping.rc | default(99) }},
                "peer_ping_output": {{ hostvars[node].peer_ping.stdout | default('NOT RUN') | to_json }},
                "ntp_sync": {{ hostvars[node].ntp_sync.stdout | default('NOT RUN') | trim | to_json }},
                "nested_virtualization_rc": {{ hostvars[node].nested_virtualization.rc | default(99) }},
                "cluster_status": {{ hostvars[node].cluster_status.stdout | default('NOT RUN') | to_json }}
              }{% if not loop.last %},{% endif %}
          {% endfor %}
            }
          }
      when: groups['proxmox_nodes'] | length > 0
