name: Ansible validation

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-validation.yml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible

      - name: Python syntax checks
        run: python -m py_compile scripts/validate_env.py scripts/check_envir_inventory.py tests/test_validate_env.py
        working-directory: ansible

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        working-directory: ansible

      - name: Ansible playbook syntax checks
        run: |
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/preflight.yml --syntax-check
          ansible-playbook playbooks/cluster.yml --syntax-check
          ansible-playbook playbooks/deploy_guests.yml --syntax-check
          ansible-playbook playbooks/connectivity.yml --syntax-check
        working-directory: ansible
